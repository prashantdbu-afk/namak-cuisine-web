name: Quality
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.16.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm check:assets
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm test:a11y
      - run: pnpm test:performance
      - run: pnpm test:visual
        env:
          VERCEL_ENV: preview
      - name: Upload visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: namak-visual-review-${{ github.event.pull_request.number || github.run_number }}
          path: visual-review
          if-no-files-found: error
          retention-days: 14
